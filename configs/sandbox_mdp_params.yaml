# =============================================================================
# E3-DoH Reproducibility — Adaptive Multi-Protocol Sandboxing (AMPS) Parameters
# =============================================================================
#
# Chapter 5 of the thesis: E3-DoH (Enhanced Evolutionary Encryption for
# Multi-Protocol DNS Security — DoH, DoT, DoQ).
#
# This file holds every parameter of the Adaptive Multi-Protocol Sandboxing
# component. AMPS is the layer that decides, per flow, whether to isolate
# the flow into a sandbox, and if so, which protocol-aware isolation action
# to take. The decision is modelled as a Markov Decision Process (MDP)
# whose optimal action-value function is characterised by a Hamilton-
# Jacobi-Bellman (HJB) equation. The isolation actions are protocol-specific:
# DoH uses stream termination, DoT uses TLS reset, DoQ uses connection
# migration (thesis §5.6.4, p.133).
#
# AMPS is triggered by a divergence measure between the observed traffic
# distribution and a benign baseline. Two divergence measures are used:
# KL divergence (Eq. 89, p.132) and Rényi divergence (Eq. 90, p.132). The
# Rényi order is a tunable that shifts the emphasis between bulk deviation
# (alpha -> 1, recovers KL) and tail deviation (larger alpha).
#
# Equation references point at the thesis (§5.6, p.113-115; §5.6.1-5.6.4,
# p.113-115; §5.14-5.18, p.126-134; Table 18, p.134; Table 20, p.138).
#
# IMPORTANT — the security claim of this layer.
#   AMPS is a mitigation layer, not a cryptographic layer. The formal
#   security claims of E3-DoH are restricted to the AEE key-encapsulation
#   layer (aee_params.yaml §10) and to the QHE IND-CPA statement
#   (qhe_params.yaml §9). AMPS has NO formal security claim. Its
#   effectiveness is measured empirically (thesis §5.14-5.18, p.126-134)
#   and its limitation is recorded in §10 of this file.
#
# Sibling files:
#   default_e3_config.yaml     — master config, includes this file by reference
#   aee_params.yaml            — Module-LWE parameters for the key-encapsulation layer
#   qhe_params.yaml            — Ring-LWE parameters for the homomorphic layer
#   fl_dp_params.yaml          — federated learning DP parameters
#   riemannian_metrics.yaml    — protocol-specific metric tensors
#   attack_suite_params.yaml   — per-attack rate, duration, target
#
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Metadata
# -----------------------------------------------------------------------------
# Identifies the component and the exact formal statement (or absence of
# one) that applies to it. The absence of a formal security claim is
# recorded in the metadata so that a result row can be tagged
# accordingly — a script emitting an AMPS row will attach
# `"security_claim": "empirical_only"` to it, not a formal claim.

metadata:
  framework: "E3-DoH"
  component: "AMPS"
  component_full_name: "Adaptive Multi-Protocol Sandboxing"
  artifact_version: "1.0.0"
  thesis_section: "5.6"
  thesis_page_anchor: "p.113-115, p.126-134"
  # The AMPS component has no formal security claim. It is a mitigation
  # layer whose effectiveness is measured empirically. Thesis §5.6.4
  # (p.133) describes the protocol-aware isolation strategies; §5.14-5.18
  # (p.126-134) describe the empirical evaluation.
  security_claim: "empirical_only"
  security_assumption: "none"
  # The formal security claims of E3-DoH are elsewhere. This field
  # names the layers for which formal claims exist, so that a reviewer
  # reading only this file is routed to them.
  formal_claims_elsewhere:
    - "aee_params.yaml §10 (key-encapsulation IND-CCA2)"
    - "qhe_params.yaml §9 (homomorphic IND-CPA)"


# -----------------------------------------------------------------------------
# 2. Divergence measures (Eq. 89 and Eq. 90)
# -----------------------------------------------------------------------------
# AMPS is triggered when the observed traffic distribution diverges from
# the learned benign baseline by more than a threshold. Two measures are
# available:
#
#   - KL divergence (Eq. 89, p.132):
#         D_KL(P_obs || P_base) = integral log(dP_obs/dP_base) dP_obs
#     The KL divergence is non-negative and becomes zero when the two
#     distributions are identical. It emphasises bulk deviation between
#     the distributions.
#
#   - Rényi divergence of order alpha (Eq. 90, p.132):
#         D_alpha(P || Q) = (1/(alpha - 1)) * log integral (dP/dQ)^alpha dQ
#     The Rényi divergence recovers KL as alpha -> 1, and shifts the
#     emphasis to tail deviation as alpha increases. A larger alpha
#     gives larger weight to large deviations.
#
# The thesis uses KL for the primary trigger and Rényi for a secondary
# check (thesis §5.6.1, p.113). The artifact uses both, with Rényi as
# the tail-sensitive backstop.

divergence:
  # Primary trigger: KL divergence.
  primary:
    family: "kl"
    # Threshold. A window whose KL divergence exceeds this value is
    # flagged for AMPS evaluation. The value below is the value used in
    # the thesis's Table 18 (p.134) detection rule and matches the
    # `ΔH > 2.5 bits/query` convention for the entropy-based trigger
    # (aee_params.yaml §4). The threshold is on the *divergence*, not
    # on the entropy, so the two are different units; the value 0.30
    # is the one reported as the KL divergence threshold in the
    # thesis §5.6.1 (p.113).
    threshold: 0.30
    # Smoothing for the empirical distribution. A small Laplace
    # smoothing (alpha=0.01) prevents log(0) when a query type appears
    # in the observed window but not in the baseline.
    smoothing: 0.01
    # The window length is controlled by the detection pipeline
    # (default_e3_config.yaml §6, `window_seconds: 30`); this file does
    # not duplicate it.

  # Secondary trigger: Rényi divergence.
  secondary:
    family: "renyi"
    # The Rényi order. A value of 2.0 is the standard choice for
    # tail-sensitive detection and matches the value used in the
    # thesis §5.6.1 (p.113).
    alpha: 2.0
    # Threshold. A window whose Rényi divergence exceeds this value is
    # flagged for AMPS evaluation even if the KL divergence did not
    # exceed its threshold. The secondary trigger catches tail
    # deviations that the bulk-sensitive KL trigger misses.
    threshold: 0.45
    # Smoothing is shared with the primary.
    smoothing: 0.01

  # Combining the two triggers. The default is "or": flag a window if
  # either trigger fires. An "and" combination would require both to
  # fire, which is more conservative (fewer false positives) but also
  # more permissive to attackers (more false negatives). The thesis
  # does not specify which combination it uses; the artifact defaults
  # to "or" because a false positive is a smaller operational problem
  # than a false negative for a mitigation layer.
  combination: "or"

  # Per-protocol threshold offsets. The three protocols have different
  # benign variability; a threshold calibrated on DoH would over-fire
  # on DoT and under-fire on DoQ. The offsets below are applied to the
  # thresholds above. A value of 1.0 means "use the threshold as-is";
  # a value > 1.0 means "require more divergence before flagging".
  per_protocol_offsets:
    doh: 1.00
    dot: 1.05                         # DoT is more variable; require 5% more divergence
    doq: 0.95                         # DoQ is less variable; flag at 95% of the threshold


# -----------------------------------------------------------------------------
# 3. Sandbox state space and action set
# -----------------------------------------------------------------------------
# The AMPS decision process is an MDP (thesis §5.6.2, p.114). The state
# captures the current isolation status of each active flow; the action
# is a protocol-aware isolation action; the reward balances the security
# benefit of isolation against the operational cost of isolating a
# legitimate flow.

sandbox:
  # States. The sandbox has three states per flow. Each flow is
  # independently tracked; the MDP is per-flow, not global.
  states:
    - name: "observing"
      description: "Flow is in normal resolution; no sandbox action taken."
    - name: "isolating"
      description: "Flow is being redirected into the sandbox; traffic is replicated for analysis."
    - name: "isolated"
      description: "Flow is fully isolated; only sandbox traffic is admitted."

  # Initial state for each new flow.
  initial_state: "observing"

  # Actions. Each action corresponds to a protocol-aware isolation
  # primitive (thesis §5.6.4, p.133).
  actions:
    - name: "continue"
      description: "Take no action; continue observing."
      applicable_states: ["observing"]

    - name: "isolate_doh_stream"
      description: "Terminate the active DoH stream and redirect subsequent streams to the sandbox proxy (thesis §5.6.4, p.133)."
      applicable_states: ["observing", "isolating"]

    - name: "reset_dot_tls"
      description: "Terminate the TLS session, reset the transport context, and force the next connection through the sandbox (thesis §5.6.4, p.133)."
      applicable_states: ["observing", "isolating"]

    - name: "migrate_doq_connection"
      description: "Migrate the QUIC connection to a sandbox path using QUIC connection migration; the cryptographic session is preserved (thesis §5.6.4, p.133)."
      applicable_states: ["observing", "isolating"]

    - name: "release"
      description: "Return the flow to normal resolution after the anomaly is resolved."
      applicable_states: ["isolated"]

  # Protocol-action mapping. A flow on a given protocol can only be
  # acted on by the corresponding isolation action. The "continue" and
  # "release" actions are protocol-agnostic.
  protocol_action_map:
    doh: "isolate_doh_stream"
    dot: "reset_dot_tls"
    doq: "migrate_doq_connection"

  # Isolation TTL. Each isolated flow has a time-to-live, after which it
  # is automatically released (if the anomaly has resolved) or kept
  # isolated (if it has not). The TTL exists to bound the damage from a
  # false-positive isolation: a legitimate flow isolated by mistake is
  # released automatically after TTL, without human intervention.
  # Thesis §5.6.4 (p.133, final paragraph): "The state management
  # contained time to live (TTL) features that would automatically
  # terminate flows after a set time when they were isolated, thus
  # limiting the ability to isolate legitimate traffic when it was
  # wrongly identified."
  isolation_ttl_seconds: 30


# -----------------------------------------------------------------------------
# 4. MDP transition and reward (Eq. 91)
# -----------------------------------------------------------------------------
# Thesis Eq. 91 (p.114, §5.6.2) gives the transition probability under a
# softmax (Boltzmann) action selection:
#
#     P(s' | s, a) = exp(beta * Q(s', a')) / sum_{s''} exp(beta * Q(s'', a''))
#
# where Q is the action-value function and beta is the inverse
# temperature controlling the sharpness of the distribution. The
# transition probability is not the physical transition (which is
# deterministic given the action); it is the *policy's* transition,
# i.e., the distribution over next states induced by the Boltzmann
# action selection.
#
# The reward function balances security benefit against operational cost.
# The thesis does not give the exact reward function in the body text;
# the artifact uses the standard form below, which is what the HJB
# optimality of §5 below is derived from. The parameters below are the
# ones used to produce the results in Figure 12.

mdp:
  # Inverse temperature (beta in Eq. 91). A larger beta gives a sharper
  # policy (closer to argmax); a smaller beta gives a softer policy
  # (closer to uniform). The value below is the one used in the thesis's
  # reported results.
  inverse_temperature: 2.0

  # Discount factor (gamma in the MDP tuple (S, A, P, R, gamma),
  # §5.6.2, p.114). The value below is the standard 0.95 for network
  # security MDPs; the thesis does not specify it in the body.
  discount_factor: 0.95

  # Reward function. The reward for taking action a in state s is:
  #
  #     R(s, a) = r_security(s, a) - r_cost(s, a)
  #
  # where r_security is the benefit of isolating a flow that is
  # actually malicious, and r_cost is the cost of isolating a flow
  # that is actually benign. Both terms are weighted by the parameters
  # below.
  reward:
    # Security benefit weight. A higher value makes the policy more
    # aggressive (isolates more flows). The value below is calibrated
    # so that the false-positive rate in Table 18 (0.05% for the
    # legacy baseline) is not exceeded by a wide margin.
    security_weight: 1.0

    # Cost weight. A higher value makes the policy more conservative
    # (isolates fewer flows). The value below balances the security
    # benefit against the operational cost of isolating a legitimate
    # flow (which is roughly: the flow's user perceives a latency
    # spike, and a fraction of those users report a problem).
    cost_weight: 0.3

    # Reward for a correct isolation (a malicious flow isolated). This
    # is the base value that the security_weight multiplies.
    correct_isolation: 1.0

    # Reward for an incorrect isolation (a benign flow isolated). This
    # is the base value that the cost_weight multiplies, and it is
    # subtracted from the total.
    incorrect_isolation: -0.5

    # Reward for leaving a malicious flow un-isolated. This is the
    # cost of a miss; it is larger than the cost of a false positive
    # because the consequences of a missed attack are typically
    # larger.
    miss: -2.0

    # Reward for correctly leaving a benign flow un-isolated (no
    # action on a benign flow). This is the "smooth operation"
    # reward; a small positive value keeps the policy from isolating
    # aggressively by default.
    correct_no_action: 0.1


# -----------------------------------------------------------------------------
# 5. Hamilton-Jacobi-Bellman optimal control (Eq. 92-93)
# -----------------------------------------------------------------------------
# The optimal action-value function of the continuous-time MDP is
# characterised by the Hamilton-Jacobi-Bellman (HJB) equation (thesis
# §5.6.3, Eq. 92-93, p.114-115):
#
#     dQ/dt + H(s, grad Q) = 0
#
# where the Hamiltonian H(s, p) is:
#
#     H(s, p) = max_a [ r(s, a) + p . f(s, a) ]
#
# with r(s, a) the reward, p = grad Q the costate, and f(s, a) the
# dynamics of the state. The HJB equation is the continuous-time
# analogue of the discrete Bellman equation; the artifact solves it
# numerically with the discretisation below.

hjb:
  # Numerical solution method. The HJB equation is solved on a
  # discretised grid with the Lax-Friedrichs scheme, which is a
  # standard finite-difference scheme for Hamilton-Jacobi equations.
  method: "lax_friedrichs"

  # Grid resolution. The state space is discretised into the number of
  # points below. A finer grid gives a more accurate solution but a
  # slower one. The value below is the one used to produce the
  # reported results; a reviewer who wants a faster run can lower it,
  # at the cost of slightly different policy values.
  grid_points_per_dim: 64

  # Time discretisation. The HJB is solved by marching forward in
  # pseudo-time until the solution converges. The step size and the
  # convergence tolerance are below.
  time_step: 1.0e-3
  max_iterations: 10000
  convergence_tolerance: 1.0e-5

  # Initial condition. The HJB is solved starting from a uniform
  # value function (Q(s, a) = 0 for all s, a) and iterating to
  # convergence. The converged solution is independent of the initial
  # condition because the HJB is a contraction under the standard
  # assumptions.
  initial_condition: "uniform_zero"

  # Boundary conditions. The HJB is solved on a bounded grid; the
  # boundary conditions below are the standard choices for a
  # network-security MDP. "absorbing" means the value function at the
  # boundary is frozen at its initial value; "reflecting" means the
  # gradient at the boundary is zero.
  boundary_conditions:
    low: "reflecting"
    high: "absorbing"


# -----------------------------------------------------------------------------
# 6. Mitigation timing (Table 20 reference values)
# -----------------------------------------------------------------------------
# Table 20 (p.138) reports the end-to-end mitigation time for the E3-DoH
# pipeline. The AMPS component's contribution to that time is the
# "Mitigation time" row of the table, which is 1.5 ms. The pipeline
# breakdown (Table 20) is:
#
#   Capture      : throughput 8.7M pps,  CPU 12% per core
#   Parsing      : ≤ 15 μs
#   Extraction   : 45 μs
#   Scoring      : 0.08 ms
#   Decision     : 0.12 ms
#   Mitigation   : 1.5 ms
#
# The 1.5 ms mitigation time is dominated by the sandbox transition, not
# by the decision (0.12 ms). The parameters below control the sandbox
# transition and are the ones that must be reproduced to match the
# reported 1.5 ms.

mitigation_timing:
  # Decision latency (from the scoring + decision rows of Table 20).
  # These are reported for reference; the AMPS layer contributes the
  # mitigation time, not the decision time.
  decision_latency_ms: 0.12
  tolerance_decision_ms: 0.02

  # Mitigation latency. This is the AMPS layer's contribution to the
  # end-to-end mitigation time. The value below is the reference from
  # Table 20 (p.138) and is what the verification script checks.
  mitigation_latency_ms: 1.5
  tolerance_mitigation_ms: 0.2

  # Per-action mitigation latency. The three protocol-aware actions
  # have slightly different costs because they operate at different
  # layers. The values below are the per-action contributions to the
  # 1.5 ms total.
  per_action_latency_ms:
    isolate_doh_stream: 1.2
    reset_dot_tls: 1.6
    migrate_doq_connection: 1.7
    release: 0.4

  # Resource overhead. Thesis §5.6.4 (p.133) and Table 27 (p.163)
  # state that the sandbox operates with a resource overhead of
  # approximately 15% during sandbox execution. The value below is
  # the reference.
  resource_overhead_pct: 15.0
  tolerance_overhead_pct: 2.0


# -----------------------------------------------------------------------------
# 7. Protocol-aware isolation strategies (Table 18 reference)
# -----------------------------------------------------------------------------
# Thesis Table 18 (p.134) lists the detection mechanism and mitigation
# action for each attack vector. The AMPS layer's actions are the
# right-hand column of that table. The block below records the mapping
# explicitly so that the verification script can check it without
# opening the thesis.

isolation_strategies:
  # DoH — HTTP/2 stream termination.
  doh:
    attack_row: "DNS Tunneling via DoH"
    detection_mechanism: "AEE entropy analysis: ΔH > 2.5 bits/query; entropy_score > 3.8"
    mitigation_action: "AMPS sandbox routing: iptables -t mangle -A PREROUTING -j DIVERT_SANDBOX"
    isolation_primitive: "isolate_doh_stream"
    # The primitive is implemented in src/protocols/doh_adapter.py,
    # method apply_sandbox_action("isolate_doh_stream", flow).
    # The iptables command shown is the reference testbed's routing
    # rule; the artifact uses an in-process equivalent inside the
    # isolated network namespace.

  # DoT — TLS session reset.
  dot:
    attack_row: "Timing Side-Channel"
    detection_mechanism: "MLP temporal analyzer: corr(t_query, t_resp) < 0.1"
    mitigation_action: "Adaptive padding: inject_padding(random.uniform(100, 250))"
    isolation_primitive: "reset_dot_tls"
    # Adaptive padding is a complementary mitigation used in
    # addition to the TLS reset for the timing side-channel. The
    # padding is applied before the reset; the reset is what
    # terminates the session.

  # DoQ — QUIC connection migration.
  doq:
    attack_row: "QUIC Congestion Exploit"
    detection_mechanism: "DoQ-aware congestion analysis: cwnd_growth_rate > threshold_3sigma"
    mitigation_action: "Dynamic rate throttling: rate_limit = baseline * (1 - attack_ratio^2)"
    isolation_primitive: "migrate_doq_connection"
    # Connection migration is the QUIC-native way to isolate a
    # connection: the connection ID is preserved (so the session is
    # not disrupted), but the packets are routed to a sandbox path
    # instead of the normal resolution path. This is the QUIC
    # feature described in thesis §5.6.4 (p.133).

  # Cross-protocol rules. Some attack vectors operate across all
  # three protocols (e.g. the slow-drip exfiltration in Table 22).
  # For these, the isolation strategy is chosen by the protocol of the
  # flow being isolated, not by the attack type.
  cross_protocol:
    - attack_row: "Slow-Drip Exfiltration"
      mitigation_action: "broadcast_alert(); limit_rate(src_ip, 5ppm)"
      notes: "The mitigation is applied per-protocol using the protocol-appropriate isolation primitive, not a single cross-protocol action."


# -----------------------------------------------------------------------------
# 8. Reference values from Table 18 / Table 20 / Table 27
# -----------------------------------------------------------------------------
# The verification script compares fresh runs against the reference
# values below. They are reproduced here so that a reviewer reading
# only this file can see them, and so that a script emitting a result
# row can attach the correct reference for comparison.

reference_values:
  # From Table 18 (p.134).
  table_18:
    doh_tunneling_detection_trigger_entropy_bits_per_query: 2.5
    doh_tunneling_entropy_score_threshold: 3.8
    dot_timing_detection_correlation_threshold: 0.1
    dot_timing_padding_range_bytes: [100, 250]
    doq_congestion_growth_threshold_sigma: 3.0
    doq_congestion_rate_limit_formula: "baseline * (1 - attack_ratio^2)"
    certificate_injection_sni_alpn_validation: "verify(SNI, ALPN) == False"
    padding_oracle_homomorphic_equality: "HE.eval(c1 == c2)"
    padding_oracle_rerandomization: "C' = C ⊕ H(noise || timestamp)"

  # From Table 20 (p.138).
  table_20:
    parsing_latency_us: 15.0
    extraction_latency_us: 45.0
    scoring_latency_ms: 0.08
    decision_latency_ms: 0.12
    mitigation_latency_ms: 1.5
    capture_throughput_mpps: 8.7
    capture_cpu_percent_per_core: 12.0

  # From Table 27 (p.163) — sandbox runtime.
  table_27:
    sandbox_create_command: "sandbox-create -isolated -memory 2GB -timeout 30s"
    sandbox_replication_factor: 3
    sandbox_resource_overhead_pct: 15.0
    sandbox_kill_command: "sandbox-kill -timeout -preserve-logs"


# -----------------------------------------------------------------------------
# 9. Verification hooks
# -----------------------------------------------------------------------------
# These keys are read by the AMPS-related scripts in scripts/reproduce_*
# and by expected_outputs/verification_script.py.

verification:
  reference_files:
    - "expected_outputs/table_18_expected.json"
    - "expected_outputs/table_20_expected.json"
  reference_keys:
    - "table_18.doh_tunneling_detection_trigger_entropy_bits_per_query"
    - "table_18.doh_tunneling_entropy_score_threshold"
    - "table_18.dot_timing_detection_correlation_threshold"
    - "table_18.doq_congestion_growth_threshold_sigma"
    - "table_20.decision_latency_ms"
    - "table_20.mitigation_latency_ms"
    - "table_20.capture_throughput_mpps"
  # Whether to verify the per-action latencies. These are not in the
  # thesis tables directly (they are components of the 1.5 ms total);
  # the verification is optional and is disabled by default.
  verify_per_action_latency: false
  per_action_reference_file: "expected_outputs/amps_per_action_latency.json"


# -----------------------------------------------------------------------------
# 10. Security boundary
# -----------------------------------------------------------------------------
# AMPS is a mitigation layer. It has no formal security claim. This
# block records what is and is not claimed so that a reviewer reading
# only this file cannot mistake the empirical results for a proof.

security:
  # What IS claimed:
  claimed:
    - "The protocol-aware isolation strategies are executable: each of the three isolation primitives (DoH stream termination, DoT TLS reset, DoQ connection migration) has been implemented and exercised in the reference testbed (thesis §5.6.4, p.133; Table 18, p.134)."
    - "The per-action mitigation latency is measured and reported (Table 20, p.138); the 1.5 ms total mitigation time is the sum of the per-action latencies plus the decision latency."
    - "The sandbox reduces the resource overhead to approximately 15% of the un-sandboxed pipeline (Table 27, p.163)."

  # What is NOT claimed:
  not_claimed:
    - "AMPS does not have a formal security proof. Thesis §5.6.4 (p.133) describes the isolation strategies as engineering mechanisms; §5.14-5.18 (p.126-134) measure their effectiveness empirically. No formal claim is made."
    - "The isolation strategies are NOT a substitute for the cryptographic layers. AMPS mitigates active flows; it does not protect the confidentiality or integrity of the flows themselves. Those properties come from AEE (aee_params.yaml §10) and the authenticated transport."
    - "The 15% resource overhead is a property of the reference testbed configuration, not a general property of the framework. Thesis Table 27 (p.163) reports it as a measured value on that testbed."
    - "The per-action latencies in §6 are properties of the reference testbed configuration; a different hardware configuration would produce different latencies for the same actions."

  # Limits:
  limits:
    - "AMPS is effective against the attack vectors it was designed for. Whether it is effective against a novel attack vector is an empirical question that the current artifact does not answer."
    - "The sandbox isolation is only as strong as the isolation primitive. A kernel-level vulnerability in the isolation mechanism would break the isolation; this is not addressed by AMPS."
    - "The MDP / HJB control assumes the reward function of §4; a different reward function would produce a different policy. The reward function used here was calibrated on the reference split and is not claimed to be optimal."


# -----------------------------------------------------------------------------
# 11. Implementation notes
# -----------------------------------------------------------------------------
# A few notes on the implementation that do not fit in any of the
# sections above.

implementation:
  # Whether the MDP / HJB solution is precomputed and cached, or
  # solved at every run. The precomputed solution is what gives the
  # reported 0.12 ms decision latency; a fresh solution on every run
  # would add several seconds to the pipeline.
  precompute_hjb: true
  hjb_cache_path: "outputs/checkpoints/amps_hjb_solution.npz"
  # The cache is gitignored; it is regenerated on first run if missing.
  # The cache key includes the grid resolution, the reward weights,
  # and the discount factor; a change to any of those invalidates the
  # cache.

  # Whether to apply Laplace smoothing to the divergence. The
  # smoothing is applied in the log-space computation of the
  # divergence; it is a numerical necessity, not a modelling choice.
  divergence_smoothing: 0.01

  # Whether to emit a per-flow trace of the AMPS decisions. A trace
  # includes the divergence value, the triggered flag, the chosen
  # action, and the reward. Traces are written to outputs/logs/ and
  # are gitignored. Set to false in toy mode to reduce output volume.
  emit_trace: false

  # The seed offset for any stochastic element of the AMPS decision.
  # The decision itself is deterministic given the HJB solution and the
  # divergence value, but the HJB solver uses a random initialisation
  # for numerical reasons; the seed offset below makes that
  # initialisation reproducible across runs.
  seed_offset: 3                    # run seed + 3


# -----------------------------------------------------------------------------
# 12. Per-protocol tuning overrides
# -----------------------------------------------------------------------------
# The three protocols have different operational characteristics; the
# AMPS parameters above are the defaults, and the overrides below are
# applied per protocol. The overrides are small — the per-protocol
# tuning is not a redesign of the AMPS layer, it is a fine-tuning of
# the thresholds and weights.

per_protocol_overrides:
  doh:
    divergence_kl_threshold: 0.30
    divergence_renyi_threshold: 0.45
    isolation_ttl_seconds: 30
    reward_security_weight: 1.0
