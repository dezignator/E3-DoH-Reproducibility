# -----------------------------------------------------------------------------
# 11. Implementation notes
# -----------------------------------------------------------------------------
# A few notes on the implementation of the attack suite that do not fit
# in any of the sections above.

implementation:
  # The attack runner (src/attacks/__init__.py) reads this file at
  # import time and validates it against the JSON schema in
  # configs/schema.json. A malformed entry is a load-time error, not a
  # run-time error, so that a misconfiguration is caught before any
  # traffic is generated.

  # The runner executes scenarios in the order A01..A15. An execution
  # report is written to outputs/logs/attack_run_<timestamp>.json with,
  # for each scenario, the target, the rate actually achieved, the
  # detection trigger that fired, the mitigation action that was
  # invoked, and the wall-clock duration.

  # The runner does NOT shell out to the reference tools (dns2tcp,
  # quic-flood, mitmproxy, padbuster, boofuzz, etc.). It re-implements
  # the injection using the Python libraries listed in requirements.txt
  # (scapy for packet construction, h2 for HTTP/2, aioquic for QUIC,
  # dnspython for DNS). This is deliberate: a hermetic simulation is
  # easier to audit, easier to reproduce, and does not require a
  # reviewer to install offensive tooling.

  # The runner's output schema is documented in
  # scripts/reproduce_tables/table_18_attack_mitigation.py (which
  # consumes the output). Do not change the output schema without
  # regenerating expected_outputs/table_18_expected.json and
  # expected_outputs/table_20_expected.json.

  # Seed offset. The attack suite's stochastic elements (random
  # inter-query delay, chaff GAN sampling, fuzzing mutation rate) all
  # draw from a single seed derived from runtime.seed + 5. See
  # default_e3_config.yaml §2 for the run seed.
  seed_offset: 5

